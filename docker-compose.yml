services:

  # ─── Heather Bot ─────────────────────────────────────────────────────────────
  heather:
    build:
      context: .
      dockerfile: Dockerfile
    image: heatherbot:latest
    restart: unless-stopped
    depends_on:
      - llama-server
      - chatterbox-tts
    environment:
      # Telegram credentials (from https://my.telegram.org)
      - TELEGRAM_API_ID=CHANGE_ME
      - TELEGRAM_API_HASH=CHANGE_ME

      # Admin Telegram user ID (your personal account numeric ID)
      - ADMIN_USER_ID=CHANGE_ME

      # Telethon Imports
      - SESSION_NAME=/app/sessions/heather_session

      # Payment bot token (from @BotFather — optional, for Telegram Stars tipping)
      - PAYMENT_BOT_TOKEN=CHANGE_ME

      # Payment bot @username (no @ prefix) — used in tip messages
      - PAYMENT_BOT_USERNAME=CHANGE_ME

      # Monitoring dashboard auth key (leave empty for open access on localhost)
      - MONITOR_AUTH_TOKEN=CHANGE_ME

      # ── Internal Docker Services ──────────────────────────────────────────────
      - TEXT_HOST=llama-server
      - TEXT_PORT=1234
      - TTS_HOST=chatterbox-tts
      - TTS_PORT=5001

      # ── External Services ─────────────────────────────────────────────────────
      - IMAGE_HOST=192.168.2.10
      - IMAGE_PORT=11434
      - COMFYUI_HOST=192.168.2.10
      - COMFYUI_PORT=8188

      # ── Comfyui Configuration ─────────────────────────────────────────────────
      - UNFILTERED_MODE=true
      - MONITORING_ENABLED=true
      - MONITORING_PORT=8888
      - ALERT_COOLDOWN_SECONDS=300

      # ComfyUI face-swap source image path (for image generation)
      - COMFYUI_FACE_IMAGE=/app/ComfyUI/input/heather_face.png

    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - ./videos:/app/videos
      - ./images_db:/app/images_db
      - ./persona_example.yaml:/app/persona_example.yaml
      - C:/ComfyUI/ComfyUI/input:/app/ComfyUI/input:ro
    ports:
      - "8888:8888"

  # ─── LLM Backend ─────────────────────────────────────────────────────────────
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - C:/llama-cpp/models:/models:ro
    command: >
      --model /models/dolphin-2.9.3-mistral-nemo-12b.Q6_K.gguf
      --host 0.0.0.0
      --port 1234
      --n-gpu-layers 99
      --ctx-size 6144
    ports:
      - "1234:1234"

  # ─── Chatterbox TTS ──────────────────────────────────────────────────────────
  chatterbox-tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_TOKEN=CHANGE_ME  # token free on huggingface.co/settings/tokens
    volumes:
      - chatterbox-cache:/root/.cache/huggingface
    ports:
      - "5001:5001"

networks:
  default:
    name: heather-network

volumes:
  chatterbox-cache: