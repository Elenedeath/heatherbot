services:
  chatterbox-tts:
    build:
      context: /mnt/fast/heatherbot/heather
      dockerfile: Dockerfile.tts
    environment:
      HF_TOKEN: CHANGE_ME
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD
        - curl
        - '-f'
        - http://localhost:5001/health
      timeout: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 50m
    ports:
      - '5001:5001'
    restart: unless-stopped
    volumes:
      - chatterbox-cache:/root/.cache/huggingface

  heather:
    build:
      context: /mnt/fast/heatherbot/heather
      dockerfile: Dockerfile
    depends_on:
      - llama-server
      - chatterbox-tts
    environment:
      ADMIN_USER_ID: 'CHANGE_ME'
      AI_TIMEOUT: '120'
      ALERT_COOLDOWN_SECONDS: '300'
      COMFYUI_FACE_IMAGE: /data/comfyui-input/heather_face.png
      COMFYUI_HOST: 192.168.2.10
      COMFYUI_PORT: '8188'
      COMFYUI_TIMEOUT: '300'
      FINAL_OUTPUT_NODE: '9'
      HF_TOKEN: CHANGE_ME
      IMAGE_HOST: 192.168.2.10
      IMAGE_PORT: '30068'
      MONITORING_ENABLED: 'true'
      MONITORING_HOST: 0.0.0.0
      MONITORING_PORT: '8888'
      MONITOR_AUTH_TOKEN: CHANGE_ME
      PAYMENT_BOT_TOKEN: CHANGE_ME
      PAYMENT_BOT_USERNAME: CHANGE_ME
      SESSION_NAME: /app/sessions/heather_session
      SMALL_MODEL_MODE: 'true'
      TELEGRAM_API_HASH: CHANGE_ME
      TELEGRAM_API_ID: 'CHANGE_ME'
      TEXT_HOST: llama-server
      TEXT_PORT: '1234'
      TTS_HOST: chatterbox-tts
      TTS_PORT: '5001'
      TTS_TIMEOUT: '120'
      UNFILTERED_MODE: 'true'
      WORKFLOW_FILE: /data/workflow_flux.json
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 50m
    ports:
      - '8888:8888'
    restart: unless-stopped
    volumes:
      - /mnt/fast/heatherbot/data/sessions:/app/sessions
      - /mnt/fast/heatherbot/data/logs:/app/logs
      - /mnt/fast/heatherbot/data/videos:/app/videos
      - /mnt/fast/heatherbot/data/images_db:/app/images_db
      - /mnt/fast/heatherbot/data:/data

  llama-server:
    command: >-
      --model /models/dphn_dolphin-2.9.3-mistral-nemo-12b.Q4_K_M.gguf --host
      0.0.0.0 --port 1234 --n-gpu-layers 35 --ctx-size 6144 --flash-attn on
      --cache-type-k q8_0 --parallel 1
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              device_ids:
                - '1'
              driver: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 60s
      test:
        - CMD
        - curl
        - '-f'
        - http://localhost:1234/health
      timeout: 10s
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 50m
    ports:
      - '1234:1234'
    restart: unless-stopped
    runtime: nvidia
    volumes:
      - /mnt/fast/heatherbot/models:/models:ro

volumes:
  chatterbox-cache:

x-portals:
  - host: 0.0.0.0
    name: Web UI
    path: /
    port: 8888
    scheme: http
